<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magic Mermaid Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7ec8e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* The game draws everything on one canvas; the page just centres it
     over a deep-sea gradient so letterboxing looks intentional. */
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: linear-gradient(#7ec8e8, #3b7fc4 55%, #2b5f9e);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #game {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 60px rgba(20, 60, 120, .45);
    border-radius: 6px;
  }
  /* Friendly "turn your device" prompt on phones held upright. The game
     locks to landscape where the browser allows it; where it can't
     (e.g. iPhone Safari), this overlay asks with a picture instead. */
  #rotate {
    display: none;
    position: fixed; inset: 0; z-index: 10;
    background: linear-gradient(#7ec8e8, #3b7fc4);
    color: #fff; text-align: center;
    font: 700 28px/1.4 system-ui, sans-serif;
    padding-top: 30vh;
    text-shadow: 0 2px 8px rgba(20, 60, 120, .5);
  }
  #rotate .phone { font-size: 84px; display: block; margin-bottom: 24px;
                   animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn {
    0%, 25%  { transform: rotate(0deg); }
    60%, 100% { transform: rotate(90deg); }
  }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(90deg); } }
  @media (orientation: portrait) { #rotate { display: block; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate"><span class="phone">📱</span>TURN YOUR DEVICE SIDEWAYS</div>
<!-- manifest.js is generated by tools/build-assets.py and defines
     window.ASSET_MANIFEST (all sprite frames + backgrounds). Using a
     script tag instead of fetch() lets the game run from a plain
     double-click (file://) with no web server. -->
<script src="assets/manifest.js"></script>
<script src="game.js"></script>
<script>
  // Offline play + installability. Only meaningful over http(s) - a
  // double-clicked local copy (file://) skips this and still works.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
    navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
